        SERVICE: services/adaptive-qcm
    environment:
      <<: *environment
      PORT: 5106
      DATABASE_URL: postgresql://adaptive_qcm:local_dev_only@postgres:5432/adaptive_qcm
    ports: ["127.0.0.1:5106:5106"]
    depends_on:
