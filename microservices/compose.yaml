      args:
        SERVICE: services/communication
    environment:
      <<: *environment
      PORT: 5103
      DATABASE_URL: postgresql://communication:local_dev_only@postgres:5432/communication
    ports: ["127.0.0.1:5103:5103"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
