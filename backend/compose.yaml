# Infrastructure locale (CDC section 3.1) : PostgreSQL 16, Redis, MinIO (S3).
# Lancement : npm run infra:up
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: nexora
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: nexora_local
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - nexora-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nexora
      MINIO_ROOT_PASSWORD: nexora_local_minio
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - nexora-minio:/data

volumes:
  nexora-postgres:
  nexora-minio:
